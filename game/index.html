<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14252a; font-family: system-ui, sans-serif; color: #f7f0d9; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Bay, a top-down open-world crime game"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<aside style="position:fixed;bottom:14px;left:18px;pointer-events:none;font-size:12px;background:#102328cc;padding:8px 12px;border-left:3px solid #f1c45c">WASD move / drive | Shift sprint | E enter / exit | Mouse / Space attack | F punch<br>T taxi fare | R rampage | P / Esc pause | M mute</aside>
<script type="module" src="./src/main.js"></script>
</body>
</html>
